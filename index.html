<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#17120f">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Finanzas%20Familiares%22,%22short_name%22:%22Finanzas%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22%2317120f%22,%22theme_color%22:%22%2317120f%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%253Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20192%20192'%253E%253Crect%20fill='%2317120f'%20width='192'%20height='192'/%253E%253Ctext%20x='50%25'%20y='50%25'%20font-size='96'%20font-weight='bold'%20fill='%23d4674a'%20text-anchor='middle'%20dominant-baseline='middle'%20font-family='system-ui'%253EFF%253C/text%253E%253C/svg%253E%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%22}]}">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%2317120f' width='180' height='180'/><text x='50%' y='50%' font-size='80' font-weight='bold' fill='%23d4674a' text-anchor='middle' dominant-baseline='middle' font-family='system-ui'>FF</text></svg>">
<title>Finanzas</title>
<style>
  :root {
    --fondo: #17120f;
    --tarjeta: #201a16;
    --borde: #2f2722;
    --texto: #f2ebe6;
    --suave: #a1918a;
    --tenue: #6f625b;
    --acento: #d4674a;
    --verde: #7fb685;
    --radio: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--fondo); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
    padding: 14px 14px 40px;
  }

  /* ---------- encabezado ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .marca { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .nav { display: flex; align-items: center; gap: 10px; }
  .nav button {
    background: var(--tarjeta); border: 1px solid var(--borde); color: var(--texto);
    width: 28px; height: 28px; border-radius: 8px; font-size: 15px;
    cursor: pointer; line-height: 1; display: grid; place-items: center;
  }
  .nav button:disabled { opacity: .3; cursor: default; }
  .nav .mes {
    font-size: 12px; color: var(--suave); min-width: 120px; text-align: center;
    text-transform: capitalize; letter-spacing: .02em;
  }

  /* ---------- rejilla ---------- */
  .grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
  .principal { display: grid; gap: 12px; }
  .kpis { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .medios { display: grid; gap: 12px; }
  @media (min-width: 900px) {
    body { padding: 20px 20px 40px; }
    .grid { grid-template-columns: 1fr 320px; align-items: start; }
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .medios { grid-template-columns: 1.35fr 1fr; align-items: start; }
    .lista-scroll { max-height: calc(100vh - 150px); }
  }

  /* ---------- tarjetas ---------- */
  .card {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: var(--radio);
    padding: 16px;
  }
  .card h2, .kpi .etq {
    font-size: 10px; font-weight: 600; color: var(--tenue);
    text-transform: uppercase; letter-spacing: .1em;
  }
  .card h2 { margin-bottom: 14px; }
  .kpi .etq { margin-bottom: 10px; }
  .kpi .cifra { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .kpi.destacada {
    grid-column: 1 / -1;
    border-color: rgba(212,103,74,.55);
    background: linear-gradient(135deg, rgba(212,103,74,.14), rgba(212,103,74,.04));
  }
  .kpi.destacada .cifra { color: var(--acento); font-size: 30px; }
  @media (min-width: 900px) { .kpi.destacada { grid-column: auto; } }

  /* ---------- dona ---------- */
  .dona-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .dona { position: relative; width: 168px; height: 168px; flex-shrink: 0; margin: 0 auto; }
  .dona svg { transform: rotate(-90deg); display: block; }
  .dona .centro {
    position: absolute; inset: 0; display: grid; place-content: center;
    text-align: center; line-height: 1.25;
  }
  .dona .centro .m { font-size: 17px; font-weight: 600; }
  .dona .centro .s { font-size: 10px; color: var(--tenue); }
  .leyenda { flex: 1; min-width: 180px; display: grid; gap: 9px; }
  .leyenda .it { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .leyenda .pt { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .leyenda .nm { flex: 1; color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leyenda .pc { color: var(--texto); font-variant-numeric: tabular-nums; }

  /* ---------- barras verticales ---------- */
  .meses { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 140px; }
  .mcol { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 7px; }
  .mbar { width: 100%; max-width: 30px; background: var(--acento); border-radius: 5px 5px 2px 2px; min-height: 3px; opacity: .5; }
  .mcol.activo .mbar { opacity: 1; }
  .mlab { font-size: 10px; color: var(--tenue); text-transform: capitalize; }
  .tope { font-size: 10px; color: var(--tenue); text-align: right; margin-bottom: 6px; font-variant-numeric: tabular-nums; }

  /* ---------- barras horizontales ---------- */
  .fila { margin-bottom: 13px; }
  .fila:last-child { margin-bottom: 0; }
  .fila .l { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; margin-bottom: 5px; }
  .fila .l .n { color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fila .l .v { color: var(--texto); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pista { height: 5px; background: #2a231e; border-radius: 3px; overflow: hidden; }
  .relleno { height: 100%; border-radius: 3px; background: var(--acento); }

  /* ---------- lista ---------- */
  .lista-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .mov { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--borde); }
  .mov:first-of-type { padding-top: 0; }
  .mov:last-child { border-bottom: none; padding-bottom: 0; }
  .punto { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: var(--acento); }
  .punto.ing { background: var(--verde); }
  .mov .txt { flex: 1; min-width: 0; }
  .mov .t1 { font-size: 13px; font-weight: 500; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mov .t2 { font-size: 10.5px; color: var(--tenue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mov .val { font-size: 13px; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .val.neg { color: var(--acento); }
  .val.pos { color: var(--verde); }

  .vacio { color: var(--tenue); font-size: 12.5px; text-align: center; padding: 24px 8px; }

  /* ---------- filtro por categoría ---------- */
  .chips {
    display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--borde);
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; font-size: 11.5px; padding: 6px 11px; border-radius: 999px;
    border: 1px solid var(--borde); background: transparent; color: var(--suave);
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .chip.on { background: var(--acento); border-color: var(--acento); color: #fff; }
  .resumen-cat {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--suave); margin-bottom: 12px;
  }
  .resumen-cat b { color: var(--acento); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .leyenda .it { cursor: pointer; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
  .leyenda .it.apagado { opacity: .35; }
  .leyenda .it.on .nm { color: var(--texto); font-weight: 600; }
  .dona circle { transition: opacity .2s; }
  .dona circle.apagado { opacity: .2; }
  .quitar {
    background: none; border: none; color: var(--acento); font-size: 11px;
    cursor: pointer; padding: 0; font-family: inherit; text-decoration: underline;
  }

  /* ---------- selector de persona ---------- */
  .segmento {
    display: flex; background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 11px; padding: 3px; margin-bottom: 12px; gap: 2px;
  }
  .segmento button {
    flex: 1; border: none; background: transparent; color: var(--suave);
    font-size: 12.5px; padding: 8px 6px; border-radius: 8px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .segmento button.on { background: var(--acento); color: #fff; font-weight: 600; }
  @media (min-width: 900px) { .segmento { max-width: 460px; } }

  /* ---------- desglose por persona ---------- */
  .persona {
    padding: 12px; border-radius: 10px; border: 1px solid var(--borde);
    margin-bottom: 8px; cursor: pointer;
  }
  .persona:last-child { margin-bottom: 0; }
  .persona.on { border-color: var(--acento); background: rgba(212,103,74,.08); }
  .persona.total { background: #28201b; cursor: default; }
  .persona .pn { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .persona .pn span { font-size: 10px; font-weight: 500; color: var(--tenue); text-transform: uppercase; letter-spacing: .08em; }
  .persona .pv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .persona .pv div { font-size: 10px; color: var(--tenue); text-transform: uppercase; letter-spacing: .06em; }
  .persona .pv b {
    display: block; font-size: 13.5px; color: var(--texto); font-weight: 500;
    text-transform: none; letter-spacing: 0; margin-top: 3px; font-variant-numeric: tabular-nums;
  }
  .persona .pv b.ing { color: var(--verde); }
  .persona .pv b.gas { color: var(--acento); }
  .persona .pv b.neg { color: #e0664f; }
  .aviso {
    background: rgba(212,103,74,.1); border: 1px solid rgba(212,103,74,.35);
    color: #e8a992; border-radius: var(--radio); padding: 12px 14px;
    font-size: 12px; line-height: 1.5; margin-bottom: 12px;
  }
  .pie { text-align: center; font-size: 10.5px; color: var(--tenue); padding-top: 16px; }
  .pie button {
    background: none; border: none; color: var(--acento);
    font-size: 10.5px; cursor: pointer; text-decoration: underline; padding: 0 0 0 8px;
  }
</style>
</head>
<body>

<div class="top">
  <div class="marca">Finanzas</div>
  <div class="nav">
    <button id="prev" aria-label="Mes anterior">‹</button>
    <span class="mes" id="etiqueta-mes">Cargando…</span>
    <button id="next" aria-label="Mes siguiente">›</button>
  </div>
</div>

<div id="app"><div class="vacio">Cargando movimientos…</div></div>

<script>
(function () {
  var API = '/api/movimientos';
  var CACHE = 'finanzas_cache_v3';

  var PALETA = ['#d4674a','#e08a5f','#c4553d','#eaa478','#a8442f','#f0c0a0',
                '#8f3a28','#d99a7a','#b85a40','#e5b393','#94503c','#c07a5c','#6f2e20'];

  var movimientos = [], meses = [], indiceMes = 0, error = null, actualizado = null;
  var filtroCat = null; // categoría seleccionada, o null = todas
  var filtroPersona = null; // persona seleccionada, o null = todos
  var ORDEN_PERSONAS = ['Julian Mejia', 'Isabela Gomez', 'Ambos'];

  function nombreCorto(p) { return p === 'Ambos' ? 'Ambos' : (p || '').split(' ')[0]; }
  function personasPresentes() {
    var v = {};
    movimientos.forEach(function (m) { if (m.persona) v[m.persona] = true; });
    var extra = Object.keys(v).filter(function (p) { return ORDEN_PERSONAS.indexOf(p) === -1; });
    return ORDEN_PERSONAS.filter(function (p) { return v[p]; }).concat(extra);
  }

  var app = document.getElementById('app');
  var etiqueta = document.getElementById('etiqueta-mes');
  var btnPrev = document.getElementById('prev');
  var btnNext = document.getElementById('next');

  // ---------- utilidades ----------
  function pesos(n) { return '$' + Math.round(n).toLocaleString('es-CO'); }
  function claveMes(f) { return (f || '').slice(0, 7); }
  function esc(t) {
    return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fechaDia(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    var m3 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return Number(p[2]) + ' ' + m3[Number(p[1]) - 1];
  }
  function nombreMes(c) {
    if (!c) return '';
    var p = c.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, 1)
      .toLocaleString('es-CO', { month: 'long', year: 'numeric' });
  }
  function mesCorto(c) {
    var p = c.split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, 1)
      .toLocaleString('es-CO', { month: 'short' }).replace('.', '');
  }

  function agrupar(lista, campo, tipo) {
    var m = {};
    lista.forEach(function (x) {
      if (tipo && x.tipo !== tipo) return;
      var k = x[campo] || 'Sin definir';
      m[k] = (m[k] || 0) + x.monto;
    });
    return Object.keys(m).map(function (k) { return { nombre: k, total: m[k] }; })
      .sort(function (a, b) { return b.total - a.total; });
  }

  // ---------- componentes ----------
  function dona(filas, totalGastos) {
    if (!filas.length) return '<div class="vacio">Sin gastos este mes</div>';
    var R = 70, C = 2 * Math.PI * R, off = 0, segs = '';
    filas.forEach(function (f, i) {
      var largo = (totalGastos > 0 ? f.total / totalGastos : 0) * C;
      var apagado = filtroCat && filtroCat !== f.nombre ? ' class="apagado"' : '';
      segs += '<circle' + apagado + ' cx="84" cy="84" r="' + R + '" fill="none" stroke="' + PALETA[i % PALETA.length] +
        '" stroke-width="26" stroke-dasharray="' + largo.toFixed(2) + ' ' + (C - largo).toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '"></circle>';
      off += largo;
    });
    var leyenda = filas.map(function (f, i) {
      var pc = totalGastos > 0 ? (f.total / totalGastos) * 100 : 0;
      var estado = !filtroCat ? '' : (filtroCat === f.nombre ? ' on' : ' apagado');
      return '<div class="it' + estado + '" data-cat="' + esc(f.nombre) + '"><span class="pt" style="background:' + PALETA[i % PALETA.length] + '"></span>' +
        '<span class="nm">' + esc(f.nombre) + '</span>' +
        '<span class="pc">' + pc.toFixed(0) + '%</span></div>';
    }).join('');
    var sel = filtroCat ? filas.filter(function (f) { return f.nombre === filtroCat; })[0] : null;
    var centroM = sel ? pesos(sel.total) : pesos(totalGastos);
    var centroS = sel ? esc(sel.nombre) : 'gastado';
    return '<div class="dona-wrap">' +
      '<div class="dona"><svg width="168" height="168" viewBox="0 0 168 168">' + segs + '</svg>' +
      '<div class="centro"><div class="m">' + centroM + '</div><div class="s">' + centroS + '</div></div></div>' +
      '<div class="leyenda">' + leyenda + '</div></div>';
  }

  function ultimosMeses(claveActual) {
    var idx = meses.indexOf(claveActual);
    var ventana = meses.slice(idx, idx + 6).slice().reverse();
    if (!ventana.length) return '<div class="vacio">Sin historial</div>';
    var datos = ventana.map(function (c) {
      var g = movimientos.reduce(function (s, m) {
        var coincide = claveMes(m.fecha) === c && m.tipo === 'Gasto' &&
          (!filtroCat || m.categoria === filtroCat) &&
          (!filtroPersona || m.persona === filtroPersona);
        return s + (coincide ? m.monto : 0);
      }, 0);
      return { clave: c, gasto: g };
    });
    var max = Math.max.apply(null, datos.map(function (d) { return d.gasto; })) || 1;
    var cols = datos.map(function (d) {
      var h = Math.max((d.gasto / max) * 100, 2);
      return '<div class="mcol' + (d.clave === claveActual ? ' activo' : '') + '">' +
        '<div class="mbar" style="height:' + h.toFixed(1) + '%"></div>' +
        '<div class="mlab">' + mesCorto(d.clave) + '</div></div>';
    }).join('');
    return '<div class="tope">' + pesos(max) + '</div><div class="meses">' + cols + '</div>';
  }

  function barras(filas) {
    if (!filas.length) return '<div class="vacio">Sin datos</div>';
    var suma = filas.reduce(function (s, f) { return s + f.total; }, 0);
    return filas.map(function (f) {
      var pc = suma > 0 ? (f.total / suma) * 100 : 0;
      return '<div class="fila"><div class="l"><span class="n">' + esc(f.nombre) + '</span>' +
        '<span class="v">' + pesos(f.total) + ' · ' + pc.toFixed(0) + '%</span></div>' +
        '<div class="pista"><div class="relleno" style="width:' + pc.toFixed(1) + '%"></div></div></div>';
    }).join('');
  }

  function desglosePersonas(mesTodo) {
    var lista = personasPresentes();
    if (!lista.length) return '<div class="vacio">Sin datos</div>';

    function sumas(filtro) {
      var i = 0, g = 0;
      mesTodo.forEach(function (m) {
        if (!filtro(m)) return;
        if (m.tipo === 'Ingreso') i += m.monto; else if (m.tipo === 'Gasto') g += m.monto;
      });
      return { ing: i, gas: g, queda: i - g };
    }
    function bloque(nombre, s, clase, attr, etiqueta) {
      return '<div class="persona' + clase + '"' + attr + '>' +
        '<div class="pn">' + esc(nombre) + (etiqueta ? '<span>' + etiqueta + '</span>' : '') + '</div>' +
        '<div class="pv">' +
          '<div>Ingresos<b class="ing">' + pesos(s.ing) + '</b></div>' +
          '<div>Gastos<b class="gas">' + pesos(s.gas) + '</b></div>' +
          '<div>Queda<b' + (s.queda < 0 ? ' class="neg"' : '') + '>' + pesos(s.queda) + '</b></div>' +
        '</div></div>';
    }

    var html = lista.map(function (p) {
      var s = sumas(function (m) { return m.persona === p; });
      var on = filtroPersona === p ? ' on' : '';
      return bloque(p === 'Ambos' ? 'Compartido (Ambos)' : p, s, on, ' data-persona="' + esc(p) + '"', '');
    }).join('');

    html += bloque('Total juntos', sumas(function () { return true; }), ' total', '', 'Familia');
    return html;
  }

  // ---------- render ----------
  function render() {
    if (!meses.length) {
      etiqueta.textContent = '—';
      btnPrev.disabled = btnNext.disabled = true;
      app.innerHTML = (error ? avisoHTML() : '') +
        '<div class="card"><div class="vacio">Aún no hay movimientos registrados.<br>Agrégalos desde el atajo del iPhone.</div></div>' + pieHTML();
      enlazar();
      return;
    }

    var clave = meses[indiceMes];
    etiqueta.textContent = nombreMes(clave);
    btnNext.disabled = indiceMes === 0;
    btnPrev.disabled = indiceMes === meses.length - 1;

    var mesTodo = movimientos.filter(function (m) { return claveMes(m.fecha) === clave; });
    var mes = filtroPersona ? mesTodo.filter(function (m) { return m.persona === filtroPersona; }) : mesTodo;
    var ing = mes.reduce(function (s, m) { return s + (m.tipo === 'Ingreso' ? m.monto : 0); }, 0);
    var gas = mes.reduce(function (s, m) { return s + (m.tipo === 'Gasto' ? m.monto : 0); }, 0);

    var h = '';
    if (error) h += avisoHTML();

    // Selector de persona
    var pers = personasPresentes();
    h += '<div class="segmento">' +
      '<button class="' + (!filtroPersona ? 'on' : '') + '" data-persona="">Todos</button>' +
      pers.map(function (p) {
        return '<button class="' + (filtroPersona === p ? 'on' : '') + '" data-persona="' + esc(p) + '">' + esc(nombreCorto(p)) + '</button>';
      }).join('') +
    '</div>';

    var sufijo = filtroPersona ? ' · ' + esc(nombreCorto(filtroPersona)) : '';

    h += '<div class="grid"><div class="principal">';

    h += '<div class="kpis">' +
      '<div class="card kpi"><div class="etq">Ingresos' + sufijo + '</div><div class="cifra">' + pesos(ing) + '</div></div>' +
      '<div class="card kpi"><div class="etq">Gastos' + sufijo + '</div><div class="cifra">' + pesos(gas) + '</div></div>' +
      '<div class="card kpi destacada"><div class="etq">' + (filtroPersona ? 'Le queda' + sufijo : 'Te queda') + '</div><div class="cifra">' + pesos(ing - gas) + '</div></div>' +
      '</div>';

    h += '<div class="medios">' +
      '<div class="card"><h2>Gastos por categoría</h2>' + dona(agrupar(mes, 'categoria', 'Gasto'), gas) + '</div>' +
      '<div class="card"><h2>' + (filtroCat ? esc(filtroCat) + ' · 6 meses' : 'Últimos 6 meses') + '</h2>' + ultimosMeses(clave) + '</div>' +
      '</div>';

    h += '<div class="medios">' +
      '<div class="card"><h2>Por persona</h2>' + desglosePersonas(mesTodo) + '</div>' +
      '<div class="card"><h2>Método de pago</h2>' + barras(agrupar(mes, 'metodo', 'Gasto')) + '</div>' +
      '</div>';

    h += '</div>';

    // Categorías presentes este mes (gastos e ingresos), ordenadas por monto
    var cats = agrupar(mes, 'categoria').map(function (f) { return f.nombre; });
    var visibles = filtroCat ? mes.filter(function (m) { return m.categoria === filtroCat; }) : mes;

    h += '<div class="card"><h2>Movimientos · ' + visibles.length + '</h2>';

    h += '<div class="chips">' +
      '<button class="chip' + (!filtroCat ? ' on' : '') + '" data-cat="">Todas</button>' +
      cats.map(function (c) {
        return '<button class="chip' + (filtroCat === c ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
      }).join('') +
    '</div>';

    if (filtroCat) {
      var totalCat = visibles.reduce(function (s, m) { return s + m.monto; }, 0);
      h += '<div class="resumen-cat"><span>Total ' + esc(filtroCat) + ' · <button class="quitar" data-cat="">quitar filtro</button></span><b>' + pesos(totalCat) + '</b></div>';
    }

    h += '<div class="lista-scroll">';
    if (!visibles.length) {
      h += '<div class="vacio">' + (filtroCat ? 'Sin movimientos de ' + esc(filtroCat) + ' este mes' : 'Sin movimientos este mes') + '</div>';
    } else {
      h += visibles.map(function (m) {
        var esIng = m.tipo === 'Ingreso';
        return '<div class="mov">' +
          '<span class="punto' + (esIng ? ' ing' : '') + '"></span>' +
          '<div class="txt">' +
            '<div class="t1">' + esc(m.categoria || m.descripcion) + '</div>' +
            '<div class="t2">' + fechaDia(m.fecha) + ' · ' + esc(m.descripcion) + '</div>' +
          '</div>' +
          '<div class="val ' + (esIng ? 'pos' : 'neg') + '">' + (esIng ? '+ ' : '− ') + pesos(m.monto) + '</div>' +
        '</div>';
      }).join('');
    }
    h += '</div></div></div>' + pieHTML();

    app.innerHTML = h;
    enlazar();
  }

  function avisoHTML() {
    return '<div class="aviso">Sin conexión con Notion: ' + esc(error) + '<br>Mostrando la última copia guardada.</div>';
  }
  function pieHTML() {
    var t = actualizado ? 'Actualizado ' + new Date(actualizado).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' }) : '';
    return '<div class="pie"><span>' + t + '</span><button id="recargar">Actualizar</button></div>';
  }
  function enlazar() {
    var b = document.getElementById('recargar');
    if (b) b.onclick = cargar;
  }

  // ---------- datos ----------
  function procesar(lista) {
    movimientos = lista.filter(function (m) { return m.fecha; });
    var v = {}; meses = [];
    movimientos.forEach(function (m) {
      var k = claveMes(m.fecha);
      if (k && !v[k]) { v[k] = true; meses.push(k); }
    });
    meses.sort().reverse();
    indiceMes = 0;
  }

  function cargar() {
    error = null;
    fetch(API)
      .then(function (r) { return r.json().then(function (d) {
        if (!r.ok) throw new Error(d.error || d.message || ('Error ' + r.status));
        return d;
      }); })
      .then(function (d) {
        actualizado = d.actualizado || new Date().toISOString();
        procesar(d.movimientos || []);
        try { localStorage.setItem(CACHE, JSON.stringify({ actualizado: actualizado, movimientos: movimientos })); } catch (e) {}
        render();
      })
      .catch(function (e) {
        error = e.message;
        try {
          var c = JSON.parse(localStorage.getItem(CACHE) || 'null');
          if (c && c.movimientos) { actualizado = c.actualizado; procesar(c.movimientos); }
        } catch (err) {}
        render();
      });
  }

  btnPrev.onclick = function () { if (indiceMes < meses.length - 1) { indiceMes++; render(); } };
  btnNext.onclick = function () { if (indiceMes > 0) { indiceMes--; render(); } };

  // Un solo escuchador para chips, leyenda y "quitar filtro"
  app.addEventListener('click', function (e) {
    var pe = e.target.closest('[data-persona]');
    if (pe) {
      var p = pe.getAttribute('data-persona');
      filtroPersona = (!p || p === filtroPersona) ? null : p;
      render();
      return;
    }
    var el = e.target.closest('[data-cat]');
    if (!el) return;
    var cat = el.getAttribute('data-cat');
    // Tocar la categoría ya activa la desactiva
    filtroCat = (!cat || cat === filtroCat) ? null : cat;
    render();
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) cargar(); });

  cargar();
})();
</script>
</body>
</html>
